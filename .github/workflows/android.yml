name: Android Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vehicle-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish downloadable APK
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk vehicle-tracker-watch.apk
          if gh release view v0.1.1-test >/dev/null 2>&1; then
            gh release upload v0.1.1-test vehicle-tracker-watch.apk --clobber
          else
            gh release create v0.1.1-test vehicle-tracker-watch.apk \
              --title "Vehicle Tracker Watch 0.1.1 — Test Build" \
              --notes "Android Bluetooth scanning prototype for controlled testing. Does not reliably identify AirTags or confirm a tracker is following a vehicle." \
              --prerelease
          fi
